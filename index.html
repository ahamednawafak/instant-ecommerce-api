<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahamed Bakery - Online Store</title>
  <style>
    :root {
      --primary: #25D366;
      --primary-dark: #1ebe5d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .store-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .header h1 { margin: 0 0 6px 0; font-size: 1.6rem; }
    .header p { margin: 0; color: #64748b; font-size: 0.95rem; }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* Category Navigation Tabs */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: #475569;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { background: #e2e8f0; }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Product Cards */
    .product-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .product-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-card:hover { border-color: #cbd5e1; }

    .product-card.selected {
      border-color: var(--primary);
      background-color: #f0fdf4;
    }

    .product-info h3 { margin: 0 0 4px 0; font-size: 1rem; }
    .product-info p { margin: 0 0 6px 0; color: #64748b; font-size: 0.85rem; }
    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .product-price { font-weight: 700; font-size: 1.05rem; color: var(--text); }

    /* Checkout Form */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .checkout-btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkout-btn:hover { background-color: var(--primary-dark); }
    #status { margin-top: 12px; text-align: center; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>

<div class="store-container">
  <div class="header">
    <h1>🧁 Ahamed Bakery</h1>
    <p>Select products and checkout directly via WhatsApp</p>
  </div>

  <div class="section-title">1. Select an Item</div>

  <!-- Dynamic Category Tabs -->
  <div id="categoryTabs" class="category-tabs">
    <button class="tab-btn active" onclick="filterByCategory(null, this)">All</button>
  </div>
  
  <!-- Dynamic Product Grid -->
  <div id="catalog" class="product-grid">
    <p>Fetching catalog from API...</p>
  </div>

  <div class="section-title">2. Delivery Information</div>

  <form id="checkoutForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="e.g. Sarah Ahmed" required>
    </div>

    <div class="form-group">
      <label for="phone">WhatsApp Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. +97455112233" required>
    </div>

    <div class="form-group">
      <label for="address">Delivery Address</label>
      <textarea id="address" rows="2" placeholder="e.g. Building 12, West Bay, Doha" required></textarea>
    </div>

    <div class="form-group">
      <label for="notes">Special Order Request (Optional)</label>
      <input type="text" id="notes" placeholder="e.g. Please write 'Happy Birthday' on top">
    </div>

    <button type="submit" class="checkout-btn">📲 Place WhatsApp Order</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const STORE_SLUG = "ahamed-bakery";
  const API_BASE = "https://instant-ecommerce-api.onrender.com";
  
  let selectedProductId = null;
  let activeCategory = null;

  // 1. FETCH CATEGORIES: GET /stores/{slug}/categories
  async function loadCategories() {
    const tabsContainer = document.getElementById("categoryTabs");
    try {
      const res = await fetch(`${API_BASE}/stores/${STORE_SLUG}/categories`);
      if (!res.ok) return;

      const categories = await res.json();

      if (categories.length > 0) {
        // Build tab buttons dynamically
        const categoryButtons = categories.map(cat => `
          <button class="tab-btn" onclick="filterByCategory('${cat}', this)">${cat}</button>
        `).join("");

        tabsContainer.innerHTML = `
          <button class="tab-btn active" onclick="filterByCategory(null, this)">All</button>
          ${categoryButtons}
        `;
      }
    } catch (err) {
      console.warn("Could not load categories:", err);
    }
  }

  // 2. FETCH PRODUCTS: GET /stores/{slug}/products?category=...
  async function loadCatalog(category = null) {
    const catalogDiv = document.getElementById("catalog");
    catalogDiv.innerHTML = "<p>Loading items...</p>";

    // Append ?category= parameter if selected
    let url = `${API_BASE}/stores/${STORE_SLUG}/products`;
    if (category) {
      url += `?category=${encodeURIComponent(category)}`;
    }

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Store or products not found.");

      const products = await response.json();

      if (products.length === 0) {
        catalogDiv.innerHTML = "<p>No products available in this category.</p>";
        selectedProductId = null;
        return;
      }

      // Render product cards
      catalogDiv.innerHTML = products.map((product, index) => `
        <div class="product-card ${index === 0 ? 'selected' : ''}" onclick="selectProduct(${product.id}, this)">
          <div class="product-info">
            <h3>${product.name}</h3>
            <p>${product.description || 'Freshly prepared'}</p>
            <span class="badge">${product.category || 'General'}</span>
          </div>
          <div class="product-price">QAR ${product.price.toFixed(2)}</div>
        </div>
      `).join("");

      // Automatically select the first item in the visible view
      selectedProductId = products[0].id;

    } catch (err) {
      catalogDiv.innerHTML = `<p style="color: red;">API Error: ${err.message}</p>`;
    }
  }

  // Handle category tab clicks
  function filterByCategory(category, buttonElement) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    buttonElement.classList.add('active');
    
    activeCategory = category;
    loadCatalog(category);
  }

  // Handle product card selections
  function selectProduct(id, cardElement) {
    document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
    cardElement.classList.add('selected');
    selectedProductId = id;
  }

  // 3. SUBMIT ORDER TO API: POST /stores/{slug}/checkout/whatsapp
  document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!selectedProductId) {
      alert("Please select a product first.");
      return;
    }

    const statusDiv = document.getElementById("status");
    statusDiv.style.color = "#0284c7";
    statusDiv.innerText = "Connecting to API and generating order link...";

    const payload = {
      customer_name: document.getElementById("name").value,
      customer_phone: document.getElementById("phone").value,
      delivery_address: document.getElementById("address").value,
      notes: document.getElementById("notes").value || null,
      items: [
        {
          product_id: selectedProductId,
          quantity: 1
        }
      ]
    };

    try {
      const response = await fetch(`${API_BASE}/stores/${STORE_SLUG}/checkout/whatsapp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error("Failed to generate WhatsApp order link.");

      const data = await response.json();

      statusDiv.style.color = "#16a34a";
      statusDiv.innerText = "Order created! Launching WhatsApp...";

      // Redirect user to WhatsApp redirect URL
      window.location.href = data.whatsapp_redirect_url;

    } catch (err) {
      statusDiv.style.color = "#dc2626";
      statusDiv.innerText = `Error: ${err.message}`;
    }
  });

  // Initialize data on page load
  loadCategories();
  loadCatalog();
</script>

</body>
</html>
