<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahamed Bakery - Online Store</title>
  <style>
    :root {
      --primary: #25D366;
      --primary-dark: #1ebe5d;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .store-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .header h1 { margin: 0 0 6px 0; font-size: 1.6rem; }
    .header p { margin: 0; color: #64748b; font-size: 0.95rem; }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Category Navigation Tabs */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: #475569;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { background: #e2e8f0; }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Product Cards */
    .product-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .product-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }

    .product-info h3 { margin: 0 0 4px 0; font-size: 1rem; }
    .product-info p { margin: 0 0 6px 0; color: #64748b; font-size: 0.85rem; }
    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .product-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .product-price { font-weight: 700; font-size: 1.05rem; color: var(--text); }

    /* Quantity Controls */
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 2px 6px;
    }

    .qty-btn {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
    }

    .qty-btn:hover { background: #e2e8f0; }

    .qty-count {
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 20px;
      text-align: center;
    }

    /* Shopping Cart Drawer Summary */
    .cart-summary {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 24px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.05rem;
      border-top: 1px dashed #a7f3d0;
      padding-top: 8px;
      margin-top: 8px;
      color: #166534;
    }

    /* Checkout Form */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .checkout-btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkout-btn:hover { background-color: var(--primary-dark); }
    .checkout-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 12px; text-align: center; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>

<div class="store-container">
  <div class="header">
    <h1>🧁 Ahamed Bakery</h1>
    <p>Select your items, adjust quantities, and checkout via WhatsApp</p>
  </div>

  <div class="section-title">1. Menu</div>

  <!-- Dynamic Category Tabs -->
  <div id="categoryTabs" class="category-tabs">
    <button class="tab-btn active" onclick="filterByCategory(null, this)">All</button>
  </div>
  
  <!-- Dynamic Product Grid -->
  <div id="catalog" class="product-grid">
    <p>⏳ Loading store menu...</p>
  </div>

  <!-- Cart Order Summary -->
  <div class="section-title">
    <span>2. Cart Summary</span>
    <span id="cartCountBadge" style="font-size:0.85rem; font-weight:normal; color:#64748b;">0 items</span>
  </div>

  <div class="cart-summary" id="cartSummary">
    <p style="margin:0; color:#64748b; font-size:0.9rem;">Your cart is empty. Add items from the menu above.</p>
  </div>

  <div class="section-title">3. Delivery Information</div>

  <form id="checkoutForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="e.g. Sarah Ahmed" required>
    </div>

    <div class="form-group">
      <label for="phone">WhatsApp Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. +97455112233" required>
    </div>

    <div class="form-group">
      <label for="address">Delivery Address</label>
      <textarea id="address" rows="2" placeholder="e.g. Building 12, West Bay, Doha" required></textarea>
    </div>

    <div class="form-group">
      <label for="notes">Special Order Request (Optional)</label>
      <input type="text" id="notes" placeholder="e.g. Please write 'Happy Birthday' on top">
    </div>

    <button type="submit" id="submitBtn" class="checkout-btn" disabled>📲 Place WhatsApp Order</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const STORE_SLUG = "ahamed-bakery";
  const API_BASE = "https://instant-ecommerce-api.onrender.com";
  
  let allProducts = [];
  let cart = {}; // Object mapping product_id -> quantity { 1: 2, 3: 1 }

  async function safeFetch(url) {
    try {
      const response = await fetch(url);
      if (!response.ok) return { error: true };
      const data = await response.json();
      return { error: false, data };
    } catch (err) {
      return { error: true, message: err.message };
    }
  }

  // 1. FETCH CATEGORIES
  async function loadCategories() {
    const tabsContainer = document.getElementById("categoryTabs");
    const result = await safeFetch(`${API_BASE}/stores/${STORE_SLUG}/categories`);

    if (result.error || !Array.isArray(result.data) || result.data.length === 0) {
      tabsContainer.style.display = "none";
      return;
    }

    tabsContainer.style.display = "flex";
    const categoryButtons = result.data.map(cat => `
      <button class="tab-btn" onclick="filterByCategory('${cat}', this)">${cat}</button>
    `).join("");

    tabsContainer.innerHTML = `
      <button class="tab-btn active" onclick="filterByCategory(null, this)">All</button>
      ${categoryButtons}
    `;
  }

  // 2. FETCH PRODUCTS
  async function loadCatalog(category = null) {
    const catalogDiv = document.getElementById("catalog");
    catalogDiv.innerHTML = "<p>⏳ Loading menu items...</p>";

    let url = `${API_BASE}/stores/${STORE_SLUG}/products`;
    if (category) {
      url += `?category=${encodeURIComponent(category)}`;
    }

    const result = await safeFetch(url);

    if (result.error) {
      catalogDiv.innerHTML = `
        <div style="background: #fef2f2; border: 1px solid #fca5a5; padding: 12px; border-radius: 8px; color: #991b1b;">
          <strong>⚠️ Store Unavailable or Sleeping</strong><br>
          <small>Server is waking up or store slug needs registration.</small>
        </div>
      `;
      return;
    }

    allProducts = result.data;

    if (allProducts.length === 0) {
      catalogDiv.innerHTML = "<p>No products available in this category.</p>";
      return;
    }

    renderProducts(allProducts);
  }

  function renderProducts(products) {
    const catalogDiv = document.getElementById("catalog");
    catalogDiv.innerHTML = products.map(product => {
      const qty = cart[product.id] || 0;
      return `
        <div class="product-card">
          <div class="product-info">
            <h3>${product.name}</h3>
            <p>${product.description || 'Freshly prepared'}</p>
            <span class="badge">${product.category || 'General'}</span>
          </div>
          <div class="product-right">
            <div class="product-price">QAR ${product.price.toFixed(2)}</div>
            <div class="qty-controls">
              <button type="button" class="qty-btn" onclick="updateQty(${product.id}, -1)">−</button>
              <span class="qty-count" id="qty-${product.id}">${qty}</span>
              <button type="button" class="qty-btn" onclick="updateQty(${product.id}, 1)">+</button>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  // Quantity Management
  function updateQty(productId, delta) {
    const currentQty = cart[productId] || 0;
    const newQty = Math.max(0, currentQty + delta);

    if (newQty === 0) {
      delete cart[productId];
    } else {
      cart[productId] = newQty;
    }

    const qtySpan = document.getElementById(`qty-${productId}`);
    if (qtySpan) qtySpan.innerText = newQty;

    updateCartSummary();
  }

  // Render Cart Summary
  function updateCartSummary() {
    const summaryDiv = document.getElementById("cartSummary");
    const submitBtn = document.getElementById("submitBtn");
    const countBadge = document.getElementById("cartCountBadge");

    const cartProductIds = Object.keys(cart);
    
    if (cartProductIds.length === 0) {
      summaryDiv.innerHTML = `<p style="margin:0; color:#64748b; font-size:0.9rem;">Your cart is empty. Add items from the menu above.</p>`;
      submitBtn.disabled = true;
      countBadge.innerText = "0 items";
      return;
    }

    let totalAmount = 0;
    let totalItemsCount = 0;
    let html = "";

    cartProductIds.forEach(id => {
      const qty = cart[id];
      const product = allProducts.find(p => p.id === parseInt(id));
      if (product) {
        const itemTotal = product.price * qty;
        totalAmount += itemTotal;
        totalItemsCount += qty;
        html += `
          <div class="cart-item-row">
            <span>• ${qty}x ${product.name}</span>
            <span>QAR ${itemTotal.toFixed(2)}</span>
          </div>
        `;
      }
    });

    html += `
      <div class="cart-total-row">
        <span>Total Amount</span>
        <span>QAR ${totalAmount.toFixed(2)}</span>
      </div>
    `;

    summaryDiv.innerHTML = html;
    submitBtn.disabled = false;
    countBadge.innerText = `${totalItemsCount} item${totalItemsCount > 1 ? 's' : ''}`;
  }

  function filterByCategory(category, buttonElement) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    buttonElement.classList.add('active');
    loadCatalog(category);
  }

  // 3. SUBMIT MULTI-ITEM CHECKOUT TO API
  document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const cartItems = Object.keys(cart).map(id => ({
      product_id: parseInt(id),
      quantity: cart[id]
    }));

    if (cartItems.length === 0) {
      alert("Your cart is empty. Please select at least one item.");
      return;
    }

    const statusDiv = document.getElementById("status");
    statusDiv.style.color = "#0284c7";
    statusDiv.innerText = "Connecting to API and generating multi-item checkout link...";

    const payload = {
      customer_name: document.getElementById("name").value,
      customer_phone: document.getElementById("phone").value,
      delivery_address: document.getElementById("address").value,
      notes: document.getElementById("notes").value || null,
      items: cartItems
    };

    try {
      const response = await fetch(`${API_BASE}/stores/${STORE_SLUG}/checkout/whatsapp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error("Failed to generate order link.");

      const data = await response.json();

      statusDiv.style.color = "#16a34a";
      statusDiv.innerText = "Order created! Redirecting to WhatsApp...";

      window.location.href = data.whatsapp_redirect_url;

    } catch (err) {
      statusDiv.style.color = "#dc2626";
      statusDiv.innerText = `Error: ${err.message}`;
    }
  });

  // Init
  loadCategories();
  loadCatalog();
</script>

</body>
</html>
